<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nature's Plug</title>
<meta name="description" content="An open atlas of where the overburden clay on the Norwegian continental shelf can seal a well by itself, built from open well logs, leak-off tests and well reports.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b7a57'/%3E%3Crect x='13' y='4' width='6' height='24' fill='%23fff'/%3E%3Cpath d='M4 10h9v12H4zM19 10h9v12h-9z' fill='%238fe0c0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script>
  // Set the theme before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem("np-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    // inside the one-page app (index.html) the shell carries the name and the navigation
    if (window.parent !== window) document.documentElement.classList.add("embedded");
  })();
</script>
</head>
<body>
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-card">
    <div class="boot-name">Nature's Plug</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-msg" id="boot-msg">Loading open well data…</div>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><rect x="13" y="4" width="6" height="24" fill="var(--accent-ink)"/><path d="M4 10h9v12H4zM19 10h9v12h-9z" fill="var(--accent-ink)" opacity=".55"/></svg>
    <div class="brand-text">
      <h1>Nature's Plug</h1>
      <p>Where the overburden clay can seal a well by itself</p>
    </div>
  </div>
  <div class="kpis" id="kpis" aria-live="polite"></div>
  <div class="search" id="search">
    <input id="search-input" type="search" placeholder="Find a field, well or wellbore" autocomplete="off" spellcheck="false" aria-label="Find a field, well or wellbore">
    <ul class="search-results" id="search-results" hidden></ul>
  </div>
  <nav class="actions">
    <a class="btn link" href="greenclay/" title="Where the top of the Green Clay sits, predicted from well reports">Green Clay predictor</a>
    <a class="btn link" href="seismic/" title="Inline, crossline, time slice, frequency band and RMS on an open 3D cube (needs ./start.sh)">Seismic viewer</a>
    <button class="btn" id="btn-tour" type="button">Tour</button>
    <button class="btn" id="btn-method" type="button">Method and limits</button>
    <button class="btn icon" id="btn-theme" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 2a8 8 0 1 0 0 16V2z" fill="currentColor"/><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </nav>
</header>

<main class="layout" id="layout">
  <aside class="side left" id="left" aria-label="Fields, assumptions and validation">
    <div class="tabs" role="tablist">
      <button class="tab is-active" role="tab" aria-selected="true" data-tab="fields" id="tab-fields">Fields</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="assume" id="tab-assume">Assumptions</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="valid" id="tab-valid">Validation</button>
    </div>
    <section class="tabpanel" id="panel-fields" role="tabpanel" aria-labelledby="tab-fields"></section>
    <section class="tabpanel" id="panel-assume" role="tabpanel" aria-labelledby="tab-assume" hidden></section>
    <section class="tabpanel" id="panel-valid" role="tabpanel" aria-labelledby="tab-valid" hidden></section>
  </aside>

  <section class="mapwrap" id="mapwrap" aria-label="Map of the Norwegian continental shelf">
    <canvas id="map" tabindex="0" aria-label="Map. Drag to pan, scroll to zoom, click a well or a field."></canvas>
    <div class="map-top">
      <div class="seg" id="level" role="group" aria-label="Level of evidence">
        <button type="button" class="is-active" data-level="log" title="Wells with open logs: clay signature inside the pressure window">Log level</button>
        <button type="button" data-level="fm" title="All exploration wells with tops: Hordaland or Rogaland Group inside the pressure window">Formation level</button>
      </div>
      <div class="seg regions" id="regions" role="group" aria-label="Jump to a region">
        <button type="button" data-region="north">North Sea</button>
        <button type="button" data-region="norw">Norwegian Sea</button>
        <button type="button" data-region="barents">Barents Sea</button>
        <button type="button" data-region="all">All</button>
      </div>
    </div>
    <div class="map-zoom">
      <button type="button" class="btn icon" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" class="btn icon" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" class="btn icon" id="toggle-left" aria-label="Show or hide the left panel" title="Show or hide the left panel">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 4v12" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="maptip" id="maptip" hidden></div>
    <div class="tourcard" id="tourcard" hidden></div>
  </section>

  <aside class="side right" id="right" aria-label="Details" hidden></aside>
</main>

<div class="modal-root" id="modal-root" hidden></div>
<div class="tip" id="tip" hidden></div>

<noscript><p style="padding:2rem">Nature's Plug needs JavaScript. Serve this folder over http, for example with <code>python3 -m http.server</code>, and open it in a browser.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
